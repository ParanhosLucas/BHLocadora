<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BH Locadora</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><h1>🚗 BH Locadora</h1><a href="/admin">Área administrativa →</a></header>
<main>
  <div class="toolbar"><h2>Nossa frota</h2></div>
  <div id="lista" class="grid"></div>
  <p id="vazio" class="vazio" hidden>Nenhum carro cadastrado ainda.</p>
</main>
<div id="lightbox"><img alt=""></div>
<script src="/app.js"></script>
<script>
(async()=>{
  const carros = await (await fetch('/api/carros')).json();
  document.getElementById('vazio').hidden = carros.length>0;
  document.getElementById('lista').innerHTML = carros.map(cartao).join('');
  ligarLightbox();
})();
function cartao(c){
  const f=c.fotos;
  return `<article class="card">
    ${f.length?`<img class="foto zoom" src="/fotos/${f[0]}" alt="${esc(c.modelo)}">`:`<div class="semfoto">Sem foto</div>`}
    ${f.length>1?`<div class="thumbs" style="padding-top:8px">${f.slice(1).map(x=>`<img class="zoom" src="/fotos/${x}" alt="">`).join('')}</div>`:''}
    <div class="info"><h3>${esc(c.modelo)}</h3><span class="mut">Ano ${c.ano}</span>
    <span><span class="tag ${c.alugado?'alugado':''}">${c.alugado?'Alugado':'Disponível'}</span></span></div></article>`;
}
</script>
</body></html>
