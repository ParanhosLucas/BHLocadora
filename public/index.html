<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BH Locadora</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1 class="marca"><img src="logo.png" alt="BH Locadora — aluguel de veículos e equipamentos"></h1>
    <button id="sair" class="link" hidden>Sair</button>
  </header>

  <nav id="abas" class="abas" aria-label="Seções" hidden>
    <button type="button" class="aba ativa" data-aba="frota">Frota</button>
    <button type="button" class="aba" data-aba="docs">Documentos</button>
  </nav>

  <div id="aviso-demo" class="aviso" hidden>
    Modo demonstração: os dados ficam só neste navegador. Configure o Supabase em <code>public/config.js</code> para salvar de verdade.
  </div>

  <main>
    <section id="tela-login" hidden>
      <form id="form-login" class="cartao">
        <img class="logo-login" src="logo.png" alt="" aria-hidden="true">
        <h2>Entrar</h2>
        <label>E-mail <input name="email" type="email" autocomplete="username" required></label>
        <label>Senha <input name="senha" type="password" autocomplete="current-password" required></label>
        <p class="erro" id="erro-login" role="alert"></p>
        <button type="submit">Entrar</button>
      </form>
    </section>

    <section id="tela-painel" hidden>
      <div class="barra">
        <input id="busca" type="search" placeholder="Buscar modelo ou placa" aria-label="Buscar">
        <button id="novo">+ Novo carro</button>
      </div>
      <p id="resumo" class="resumo"></p>
      <div class="tabela-wrap">
        <table>
          <thead>
            <tr><th>Foto</th><th>Modelo</th><th>Placa</th><th class="num">Km</th><th>Início</th><th>Término</th><th>Contrato</th><th></th></tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </section>

    <section id="tela-docs" hidden>
      <div id="lembrete-videos" class="lembrete" hidden></div>
      <div class="barra filtros">
        <input id="busca-doc" type="search" placeholder="Buscar carro ou placa" aria-label="Buscar documentos">
        <select id="filtro-carro" aria-label="Filtrar por carro"></select>
        <select id="filtro-tipo" aria-label="Filtrar por tipo de documento"></select>
        <button id="novo-doc">+ Novo documento</button>
      </div>
      <p id="resumo-docs" class="resumo"></p>
      <p id="erro-docs" class="erro" role="alert"></p>
      <div class="tabela-wrap">
        <table>
          <thead>
            <tr><th>Carro</th><th>Placa</th><th>Documento</th><th>Validade</th><th>CRLV</th><th></th></tr>
          </thead>
          <tbody id="lista-docs"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="dialogo">
    <form id="form-carro" method="dialog">
      <h2 id="titulo-form">Novo carro</h2>
      <label>Placa <input name="placa" required maxlength="8" placeholder="ABC1D23" autocapitalize="characters"></label>
      <label>Modelo <input name="modelo" required maxlength="80" placeholder="Fiat Argo 1.0"></label>
      <label>Km atual <input name="km" type="number" min="0" step="1" required inputmode="numeric"></label>
      <div class="campo-fotos">
        <span class="rotulo">Fotos do carro (até 10)</span>
        <div id="fotos-grade" class="fotos-grade"></div>
        <div class="fotos-barra">
          <button type="button" class="sec" id="fotos-botao">+ Adicionar fotos</button>
          <span id="fotos-contagem" class="resumo"></span>
        </div>
        <input id="fotos-input" type="file" accept="image/*" multiple hidden>
      </div>
      <div class="duas">
        <label>Início do contrato <input name="contrato_inicio" type="date"></label>
        <label>Término do contrato <input name="contrato_fim" type="date"></label>
      </div>
      <label>Contrato em PDF (até 10 MB) <input name="contrato_pdf" type="file" accept="application/pdf,.pdf"></label>
      <p id="pdf-atual" class="pdf-atual" hidden></p>
      <label id="rotulo-remover" class="marcar" hidden><input name="remover_pdf" type="checkbox"> Remover o contrato atual</label>
      <div id="bloco-video-carro" hidden>
        <span class="rotulo">Vídeo do carro <span class="opcional">(opcional)</span></span>
        <p class="google-estado"></p>
        <button type="button" class="sec google-conectar">Conectar ao Google Drive</button>
        <label>Escolher vídeo do celular (vai para o seu Google Drive) <input name="video" type="file" accept="video/*"></label>
        <progress id="carro-video-progresso" max="100" value="0" hidden></progress>
        <p id="videos-existentes" class="pdf-atual" hidden></p>
      </div>
      <p class="erro" id="erro-form" role="alert"></p>
      <div class="acoes">
        <button type="button" class="sec" id="cancelar">Cancelar</button>
        <button type="submit" id="salvar">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialogo-doc">
    <form id="form-doc" method="dialog">
      <h2 id="titulo-doc">Novo documento</h2>
      <label>Carro <select name="carro_id" id="doc-carro" required></select></label>
      <label>Tipo de documento <select name="tipo" id="doc-tipo" required></select></label>
      <label>Validade <span class="opcional">(opcional)</span> <input name="validade" type="date"></label>
      <label id="rotulo-arquivo">Arquivo (PDF ou foto, até 10 MB) <input name="arquivo" type="file" accept="application/pdf,.pdf,image/*"></label>
      <div id="bloco-fotos-doc" hidden>
        <span class="rotulo">Fotos (até 10)</span>
        <div id="doc-fotos-grade" class="fotos-grade"></div>
        <div class="fotos-barra">
          <button type="button" class="sec" id="doc-fotos-botao">+ Adicionar fotos</button>
          <span id="doc-fotos-contagem" class="resumo"></span>
        </div>
        <input id="doc-fotos-input" type="file" accept="image/*" multiple hidden>
      </div>
      <div id="bloco-video" hidden>
        <p class="google-estado"></p>
        <button type="button" class="sec google-conectar">Conectar ao Google Drive</button>
        <label>Vídeo do celular (vai para o seu Google Drive) <input name="video" type="file" accept="video/*"></label>
        <progress id="video-progresso" max="100" value="0" hidden></progress>
      </div>
      <label id="rotulo-link" hidden>Link do vídeo <input name="link" type="url" placeholder="https://drive.google.com/..."></label>
      <p id="doc-atual" class="pdf-atual" hidden></p>
      <p class="erro" id="erro-doc" role="alert"></p>
      <div class="acoes">
        <button type="button" class="sec" id="doc-cancelar">Cancelar</button>
        <button type="submit" id="doc-salvar">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="galeria" class="grande">
    <div class="gal-topo"><strong id="gal-titulo"></strong><button type="button" class="sec" id="gal-fechar">Fechar</button></div>
    <img id="gal-img" alt="Foto do carro">
    <div class="gal-nav">
      <button type="button" class="sec" id="gal-ant" aria-label="Foto anterior">‹</button>
      <span id="gal-pos"></span>
      <button type="button" class="sec" id="gal-prox" aria-label="Próxima foto">›</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
